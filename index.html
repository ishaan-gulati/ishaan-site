<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hi, I'm Ishaan</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 60%, #020617);
      color: #f8fafc;
      text-align: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    .card {
      animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin-top: 1rem;
      font-size: clamp(1rem, 3vw, 1.35rem);
      color: #94a3b8;
    }
    .wave { display: inline-block; animation: wave 2s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hi, I'm Ishaan <span class="wave">👋</span></h1>
    <p>Welcome to my little corner of the internet.</p>
  </main>
</body>
</html>
